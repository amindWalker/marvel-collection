[package]
name = "marvel-collection"
version = "0.2.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.6", features = ["fullstack", "router"] }
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-log = "0.3"
log = "0.4"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
