[package]
name = "marvel-collection"
version = "0.2.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.6.3", features = ["web", "router"] }
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
wasm-log = "0.3.1"
log = "0.4.27"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
